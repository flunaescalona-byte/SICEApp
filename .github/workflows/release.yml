name: Build y Deploy SICE APK

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > sice_keystore.jks
          ls -la sice_keystore.jks

      - name: Compilar APK Release
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/sice_keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEYSTORE_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk sice_app.apk

      - name: Obtener version
        id: version
        run: |
          VERSION=$(grep 'CURRENT_VERSION_CODE' app/src/main/java/com/example/siceapp/UpdateChecker.kt | grep -o '[0-9]*')
          echo "code=$VERSION" >> $GITHUB_OUTPUT
          echo "Version detectada: $VERSION"

      - name: Generar version.json
        run: |
          VERSION=${{ steps.version.outputs.code }}
          cat > version.json << JSONEOF
          {
            "version_code": $VERSION,
            "version_name": "1.$VERSION",
            "apk_url": "https://calendario.fernandolunatech.cl/app/sice_app.apk",
            "changelog": "Build automatico #${{ github.run_number }}",
            "force_update": false
          }
          JSONEOF
          cat version.json

      - name: Preparar archivos para subir
        run: |
          mkdir -p deploy_files
          cp sice_app.apk deploy_files/
          cp version.json deploy_files/

      - name: Subir al servidor via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftp
          security: loose
          local-dir: ./deploy_files/
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
